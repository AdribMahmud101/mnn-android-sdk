# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android settings
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true

# MNN SDK Version
VERSION_NAME=1.1.0
VERSION_CODE=2

# Bundled MNN engine version. The prebuilt libs under mnn-sdk/src/main/jniLibs
# and the vendored headers under mnn-sdk/src/main/cpp/include/MNN are taken from
# the matching alibaba/MNN release. Bumping one without the other breaks ABI.
MNN_ENGINE_VERSION=3.6.1

# Android SDK versions
MIN_SDK_VERSION=21
TARGET_SDK_VERSION=34
COMPILE_SDK_VERSION=34

# Build tools
BUILD_TOOLS_VERSION=34.0.0

# Dependency versions
KOTLIN_VERSION=1.9.20
COROUTINES_VERSION=1.7.3
ANDROIDX_CORE_VERSION=1.12.0
APPCOMPAT_VERSION=1.6.1
